name: Manual Build

# 手动触发，用于在无本地 Android 工具链的情况下产出可安装的 APK。
# 设计约束（见 AGENTS.md）：
# - 只读缓存，避免污染主分支缓存；
# - 不依赖任何签名密钥，缺省回退到 debug keystore；
# - 不创建 Release / Tag，只上传 artifact。

on:
  workflow_dispatch:
    inputs:
      connectivity:
        description: 'Connectivity flavor'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - online
          - offline
      level:
        description: 'Build level'
        required: true
        default: 'Preview'
        type: choice
        options:
          - Unstable
          - Preview
          - Stable
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read   # checkout
  packages: read   # miuix snapshots from GitHub Packages

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve variant and task list
        id: variant
        env:
          CONNECTIVITY: ${{ inputs.connectivity }}
          LEVEL: ${{ inputs.level }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          case "$CONNECTIVITY" in
            both)    FLAVORS="online offline" ;;
            online)  FLAVORS="online" ;;
            offline) FLAVORS="offline" ;;
            *) echo "Unsupported connectivity: $CONNECTIVITY"; exit 1 ;;
          esac

          # Gradle 变体任务名形如 assembleOnlinePreviewDebug / assembleOfflineUnstableRelease
          # 注意：flavor 与 build type 首字母大写，level 保持原样
          TASKS=""
          for FLAVOR in $FLAVORS; do
            TASKS="$TASKS assemble${FLAVOR^}${LEVEL}${BUILD_TYPE^}"
          done

          echo "flavors=$FLAVORS" >> "$GITHUB_OUTPUT"
          echo "tasks=$(echo "$TASKS" | xargs)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "Resolved tasks: $(echo "$TASKS" | xargs)"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # 手动构建不写缓存，避免影响 PR / 发布流水线的缓存
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 允许仓库配置签名密钥时复用，未配置则 Gradle 自动回退到 debug keystore
      - name: Set up signing key (optional)
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_STORE_BASE64:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ]; then
            echo "No signing secrets configured; Gradle will fall back to the debug keystore."
            exit 0
          fi
          mkdir -p keystore
          echo "${SIGNING_KEY_STORE_BASE64}" | base64 --decode > keystore/carlyu.jks
          {
            echo "storeFile=keystore/carlyu.jks"
            echo "keyAlias=${SIGNING_KEY_ALIAS}"
            echo "keyPassword=${SIGNING_KEY_PASSWORD}"
            echo "storePassword=${SIGNING_STORE_PASSWORD}"
          } > keystore.properties

      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew ${{ steps.variant.outputs.tasks }}

      - name: List produced APKs
        run: ls -R app/build/outputs/apk || true

      - name: Upload Online APKs
        if: contains(steps.variant.outputs.flavors, 'online')
        uses: actions/upload-artifact@v7
        with:
          name: manual-online-${{ inputs.level }}-${{ inputs.build_type }}-${{ steps.variant.outputs.short_sha }}
          path: app/build/outputs/apk/online${{ inputs.level }}/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Offline APKs
        if: contains(steps.variant.outputs.flavors, 'offline')
        uses: actions/upload-artifact@v7
        with:
          name: manual-offline-${{ inputs.level }}-${{ inputs.build_type }}-${{ steps.variant.outputs.short_sha }}
          path: app/build/outputs/apk/offline${{ inputs.level }}/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 14
